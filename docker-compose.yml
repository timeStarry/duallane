# Go is the only online implementation. Production upgrades must use deploy.sh;
# a bare Compose up is for disposable/local installations only.
services:
  web:
    extends:
      file: docker-compose.go-production.yml
      service: web

  p2p:
    extends:
      file: docker-compose.go-production.yml
      service: p2p

  workspace:
    extends:
      file: docker-compose.go-production.yml
      service: workspace

  worker:
    extends:
      file: docker-compose.go-production.yml
      service: worker

  migrate:
    extends:
      file: docker-compose.go-production.yml
      service: migrate

  storage-provision:
    profiles: ["storage-migration"]
    build:
      context: .
      dockerfile: tools/node-compat/Dockerfile
    command: ["node", "storage-provision.mjs"]
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      WORKSPACE_S3_ENDPOINT: ${WORKSPACE_S3_ENDPOINT:-http://100.99.0.4:9000}
      WORKSPACE_S3_PUBLIC_ENDPOINT: ${WORKSPACE_S3_PUBLIC_ENDPOINT:-https://fs.tsio.top}
      WORKSPACE_S3_BUCKET: ${WORKSPACE_S3_BUCKET:-duallane}
      WORKSPACE_S3_REGION: ${WORKSPACE_S3_REGION:-us-east-1}
      WORKSPACE_S3_CREDENTIALS_FILE: /run/secrets/workspace-s3
      WORKSPACE_S3_SIGNED_URL_TTL_SECONDS: ${WORKSPACE_S3_SIGNED_URL_TTL_SECONDS:-300}
    secrets:
      - source: workspace-s3
        target: workspace-s3
        mode: 0600
    restart: "no"

  storage-migrate:
    profiles: ["storage-migration"]
    build:
      context: .
      dockerfile: tools/node-compat/Dockerfile
    command: ["node", "storage-migrate.mjs"]
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DUALLANE_DATA_DIR: /app/data
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-duallane}
      PGUSER: ${POSTGRES_USER:-duallane}
      PGPASSWORD: ${POSTGRES_PASSWORD:-replace-this-before-production}
      DATABASE_POOL_MAX: "2"
      DATABASE_SSL: "false"
      WORKSPACE_S3_ENDPOINT: ${WORKSPACE_S3_ENDPOINT:-http://100.99.0.4:9000}
      WORKSPACE_S3_PUBLIC_ENDPOINT: ${WORKSPACE_S3_PUBLIC_ENDPOINT:-https://fs.tsio.top}
      WORKSPACE_S3_BUCKET: ${WORKSPACE_S3_BUCKET:-duallane}
      WORKSPACE_S3_REGION: ${WORKSPACE_S3_REGION:-us-east-1}
      WORKSPACE_S3_CREDENTIALS_FILE: /run/secrets/workspace-s3
      WORKSPACE_S3_SIGNED_URL_TTL_SECONDS: ${WORKSPACE_S3_SIGNED_URL_TTL_SECONDS:-300}
      WORKSPACE_STORAGE_MIGRATION_RUN_ID: ${WORKSPACE_STORAGE_MIGRATION_RUN_ID:-}
      WORKSPACE_STORAGE_MIGRATION_MODE: ${WORKSPACE_STORAGE_MIGRATION_MODE:-backfill}
    volumes:
      - duallane-data:/app/data
    secrets:
      - source: workspace-s3
        target: workspace-s3
        mode: 0600
    restart: "no"

  storage-dedupe:
    profiles: ["storage-dedupe"]
    build:
      context: .
      dockerfile: tools/node-compat/Dockerfile
    command: ["node", "storage-dedupe.mjs"]
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DUALLANE_DATA_DIR: /app/data
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-duallane}
      PGUSER: ${POSTGRES_USER:-duallane}
      PGPASSWORD: ${POSTGRES_PASSWORD:-replace-this-before-production}
      DATABASE_POOL_MAX: "2"
      DATABASE_SSL: "false"
      WORKSPACE_STORAGE_DRIVER: ${WORKSPACE_STORAGE_DRIVER:-local}
      WORKSPACE_S3_ENDPOINT: ${WORKSPACE_S3_ENDPOINT:-http://100.99.0.4:9000}
      WORKSPACE_S3_PUBLIC_ENDPOINT: ${WORKSPACE_S3_PUBLIC_ENDPOINT:-https://fs.tsio.top}
      WORKSPACE_S3_BUCKET: ${WORKSPACE_S3_BUCKET:-duallane}
      WORKSPACE_S3_REGION: ${WORKSPACE_S3_REGION:-us-east-1}
      WORKSPACE_S3_CREDENTIALS_FILE: /run/secrets/workspace-s3
      WORKSPACE_S3_SIGNED_URL_TTL_SECONDS: ${WORKSPACE_S3_SIGNED_URL_TTL_SECONDS:-300}
      WORKSPACE_STORAGE_LOCAL_READ_FALLBACK: ${WORKSPACE_STORAGE_LOCAL_READ_FALLBACK:-true}
      WORKSPACE_STORAGE_LOCAL_MIRROR_WRITE: ${WORKSPACE_STORAGE_LOCAL_MIRROR_WRITE:-true}
      WORKSPACE_STORAGE_DEDUPE_RUN_ID: ${WORKSPACE_STORAGE_DEDUPE_RUN_ID:-}
      WORKSPACE_STORAGE_DEDUPE_MODE: ${WORKSPACE_STORAGE_DEDUPE_MODE:-backfill}
    volumes:
      - duallane-data:/app/data
    secrets:
      - source: workspace-s3
        target: workspace-s3
        mode: 0600
    restart: "no"

  v2ray-config:
    profiles: ["github-proxy-refresh"]
    image: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
    command: ["node", "/app/deploy/v2ray/render-config.mjs"]
    environment:
      V2RAY_SUBSCRIPTION_FILE: /run/secrets/v2ray-subscription
    secrets:
      - v2ray-subscription
    volumes:
      - ./deploy/v2ray/render-config.mjs:/app/deploy/v2ray/render-config.mjs:ro
      - duallane-v2ray-config:/config
    restart: "no"

  v2ray:
    profiles: ["github-proxy"]
    image: ${V2RAY_IMAGE:-dockerproxy.net/v2fly/v2fly-core@sha256:d06727b221fe8cbaed2dd1d23f9d8270cb6581dc1c2c2949bd4d04d4c332eee3}
    command: ["run", "-c", "/etc/v2ray/config.json"]
    expose:
      - "10809"
    volumes:
      - duallane-v2ray-config:/etc/v2ray:ro
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duallane}
      POSTGRES_USER: ${POSTGRES_USER:-duallane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-this-before-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - duallane-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  duallane-data:
  duallane-postgres:
  duallane-v2ray-config:

secrets:
  workspace-s3:
    file: ${WORKSPACE_S3_CREDENTIALS_FILE:-./deploy/minio/workspace-s3-credentials.example.json}
  v2ray-subscription:
    file: ${V2RAY_SUBSCRIPTION_FILE:-./deploy/v2ray/subscription-url.example}
