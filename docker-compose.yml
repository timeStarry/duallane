services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${DUALLANE_WEB_BIND:-127.0.0.1}:${DUALLANE_WEB_PORT:-8787}:8080"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DUALLANE_DATA_DIR: /app/data
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-duallane}
      PGUSER: ${POSTGRES_USER:-duallane}
      PGPASSWORD: ${POSTGRES_PASSWORD:-replace-this-before-production}
      DATABASE_AUTO_MIGRATE: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-replace-this-before-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-false}
      WORKSPACE_SMTP_ENCRYPTION_KEY: ${WORKSPACE_SMTP_ENCRYPTION_KEY:-}
      WORKSPACE_EMAIL_WORKER_ENABLED: ${WORKSPACE_EMAIL_WORKER_ENABLED:-true}
      WORKSPACE_STORAGE_DRIVER: ${WORKSPACE_STORAGE_DRIVER:-local}
      WORKSPACE_S3_ENDPOINT: ${WORKSPACE_S3_ENDPOINT:-http://100.99.0.4:9000}
      WORKSPACE_S3_PUBLIC_ENDPOINT: ${WORKSPACE_S3_PUBLIC_ENDPOINT:-https://fs.tsio.top}
      WORKSPACE_S3_BUCKET: ${WORKSPACE_S3_BUCKET:-duallane}
      WORKSPACE_S3_REGION: ${WORKSPACE_S3_REGION:-us-east-1}
      WORKSPACE_S3_CREDENTIALS_FILE: /run/secrets/workspace-s3
      WORKSPACE_S3_SIGNED_URL_TTL_SECONDS: ${WORKSPACE_S3_SIGNED_URL_TTL_SECONDS:-300}
      WORKSPACE_STORAGE_LOCAL_READ_FALLBACK: ${WORKSPACE_STORAGE_LOCAL_READ_FALLBACK:-true}
      WORKSPACE_STORAGE_LOCAL_MIRROR_WRITE: ${WORKSPACE_STORAGE_LOCAL_MIRROR_WRITE:-true}
      WORKSPACE_FRONTEND_URL: ${WORKSPACE_FRONTEND_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_TIMEOUT_MS: ${GITHUB_OAUTH_TIMEOUT_MS:-8000}
      GITHUB_PROXY_URL: ${GITHUB_PROXY_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SERVE_STATIC: "false"
      DUALLANE_STUN_URLS: ${DUALLANE_STUN_URLS:-stun:stun.l.google.com:19302}
      DUALLANE_TURN_URLS: ${DUALLANE_TURN_URLS:-}
      DUALLANE_TURN_SHARED_SECRET: ${DUALLANE_TURN_SHARED_SECRET:-}
      DUALLANE_TURN_TTL_SECONDS: ${DUALLANE_TURN_TTL_SECONDS:-600}
      DUALLANE_TURN_USERNAME: ${DUALLANE_TURN_USERNAME:-}
      DUALLANE_TURN_CREDENTIAL: ${DUALLANE_TURN_CREDENTIAL:-}
      DUALLANE_EMPTY_ROOM_GRACE_MS: ${DUALLANE_EMPTY_ROOM_GRACE_MS:-10000}
    volumes:
      - duallane-data:/app/data
    secrets:
      - source: workspace-s3
        target: workspace-s3
        mode: 0600
    restart: unless-stopped

  storage-provision:
    profiles: ["storage-migration"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["pnpm", "--filter", "@duallane/web", "storage:provision"]
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      WORKSPACE_S3_ENDPOINT: ${WORKSPACE_S3_ENDPOINT:-http://100.99.0.4:9000}
      WORKSPACE_S3_PUBLIC_ENDPOINT: ${WORKSPACE_S3_PUBLIC_ENDPOINT:-https://fs.tsio.top}
      WORKSPACE_S3_BUCKET: ${WORKSPACE_S3_BUCKET:-duallane}
      WORKSPACE_S3_REGION: ${WORKSPACE_S3_REGION:-us-east-1}
      WORKSPACE_S3_CREDENTIALS_FILE: /run/secrets/workspace-s3
      WORKSPACE_S3_SIGNED_URL_TTL_SECONDS: ${WORKSPACE_S3_SIGNED_URL_TTL_SECONDS:-300}
    secrets:
      - source: workspace-s3
        target: workspace-s3
        mode: 0600
    restart: "no"

  storage-migrate:
    profiles: ["storage-migration"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["pnpm", "--filter", "@duallane/web", "storage:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DUALLANE_DATA_DIR: /app/data
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-duallane}
      PGUSER: ${POSTGRES_USER:-duallane}
      PGPASSWORD: ${POSTGRES_PASSWORD:-replace-this-before-production}
      DATABASE_POOL_MAX: "2"
      DATABASE_SSL: "false"
      WORKSPACE_S3_ENDPOINT: ${WORKSPACE_S3_ENDPOINT:-http://100.99.0.4:9000}
      WORKSPACE_S3_PUBLIC_ENDPOINT: ${WORKSPACE_S3_PUBLIC_ENDPOINT:-https://fs.tsio.top}
      WORKSPACE_S3_BUCKET: ${WORKSPACE_S3_BUCKET:-duallane}
      WORKSPACE_S3_REGION: ${WORKSPACE_S3_REGION:-us-east-1}
      WORKSPACE_S3_CREDENTIALS_FILE: /run/secrets/workspace-s3
      WORKSPACE_S3_SIGNED_URL_TTL_SECONDS: ${WORKSPACE_S3_SIGNED_URL_TTL_SECONDS:-300}
      WORKSPACE_STORAGE_MIGRATION_RUN_ID: ${WORKSPACE_STORAGE_MIGRATION_RUN_ID:-}
      WORKSPACE_STORAGE_MIGRATION_MODE: ${WORKSPACE_STORAGE_MIGRATION_MODE:-backfill}
    volumes:
      - duallane-data:/app/data
    secrets:
      - source: workspace-s3
        target: workspace-s3
        mode: 0600
    restart: "no"

  v2ray-config:
    profiles: ["github-proxy"]
    image: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
    command: ["node", "/app/deploy/v2ray/render-config.mjs"]
    environment:
      V2RAY_SUBSCRIPTION_FILE: /run/secrets/v2ray-subscription
    secrets:
      - v2ray-subscription
    volumes:
      - ./deploy/v2ray/render-config.mjs:/app/deploy/v2ray/render-config.mjs:ro
      - duallane-v2ray-config:/config
    restart: "no"

  v2ray:
    profiles: ["github-proxy"]
    image: ${V2RAY_IMAGE:-dockerproxy.net/v2fly/v2fly-core@sha256:d06727b221fe8cbaed2dd1d23f9d8270cb6581dc1c2c2949bd4d04d4c332eee3}
    command: ["run", "-c", "/etc/v2ray/config.json"]
    depends_on:
      v2ray-config:
        condition: service_completed_successfully
    expose:
      - "10809"
    volumes:
      - duallane-v2ray-config:/etc/v2ray:ro
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["pnpm", "--filter", "@duallane/web", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-duallane}
      PGUSER: ${POSTGRES_USER:-duallane}
      PGPASSWORD: ${POSTGRES_PASSWORD:-replace-this-before-production}
      DATABASE_POOL_MAX: "2"
      DATABASE_SSL: "false"
    restart: "no"

  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duallane}
      POSTGRES_USER: ${POSTGRES_USER:-duallane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-this-before-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - duallane-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  duallane-data:
  duallane-postgres:
  duallane-v2ray-config:

secrets:
  workspace-s3:
    file: ${WORKSPACE_S3_CREDENTIALS_FILE:-./deploy/minio/workspace-s3-credentials.example.json}
  v2ray-subscription:
    file: ${V2RAY_SUBSCRIPTION_FILE:-./deploy/v2ray/subscription-url.example}
