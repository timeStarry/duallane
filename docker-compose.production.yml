services:
  web:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "${DUALLANE_LOG_MAX_SIZE:-10m}"
        max-file: "${DUALLANE_LOG_MAX_FILE:-5}"

  api:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "${DUALLANE_LOG_MAX_SIZE:-10m}"
        max-file: "${DUALLANE_LOG_MAX_FILE:-5}"

  v2ray:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "${DUALLANE_LOG_MAX_SIZE:-10m}"
        max-file: "${DUALLANE_LOG_MAX_FILE:-5}"

  postgres:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "${DUALLANE_LOG_MAX_SIZE:-10m}"
        max-file: "${DUALLANE_LOG_MAX_FILE:-5}"
    volumes:
      - production-postgres:/var/lib/postgresql/data

volumes:
  production-postgres:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME must name the authoritative production volume}
