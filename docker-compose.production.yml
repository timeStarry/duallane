services:
  web:
    restart: always

  api:
    restart: always

  v2ray:
    restart: always

  postgres:
    restart: always
    volumes:
      - production-postgres:/var/lib/postgresql/data

volumes:
  production-postgres:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME must name the authoritative production volume}
