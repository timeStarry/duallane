name: duallane-candidate

services:
  web:
    image: ${CANDIDATE_WEB_IMAGE:-duallane-candidate-web:local}
    build:
      context: ../..
      dockerfile: deploy/candidate/Dockerfile.web
      args:
        NODE_IMAGE: ${CANDIDATE_NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32}
        NGINX_IMAGE: ${CANDIDATE_NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
        DUALLANE_APP_VERSION: ${DUALLANE_APP_VERSION:-candidate}
        DUALLANE_GIT_COMMIT: ${DUALLANE_GIT_COMMIT:-working-tree}
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    ports:
      - "127.0.0.1:${CANDIDATE_WEB_PORT:-8788}:8080"
    depends_on:
      p2p:
        condition: service_healthy
      workspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"ok\":true'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  p2p:
    image: ${CANDIDATE_P2P_IMAGE:-duallane-candidate-p2p:local}
    build:
      context: ../..
      dockerfile: Dockerfile.p2p
      args:
        GO_IMAGE: ${CANDIDATE_GO_IMAGE:-docker.m.daocloud.io/library/golang:1.26-bookworm@sha256:9fdc884aacc3bec89b20ffc69f4bb369c78210e3e4f600387b5128b12c199f81}
        GOPROXY: ${CANDIDATE_GOPROXY:-https://proxy.golang.org,direct}
        DEBIAN_MIRROR: ${CANDIDATE_DEBIAN_MIRROR:-http://deb.debian.org}
        RUNTIME_IMAGE: ${CANDIDATE_RUNTIME_IMAGE:-docker.m.daocloud.io/library/debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
        DUALLANE_APP_VERSION: ${DUALLANE_APP_VERSION:-candidate}
        DUALLANE_GIT_COMMIT: ${DUALLANE_GIT_COMMIT:-working-tree}
    user: "65532:65532"
    read_only: true
    expose:
      - "8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DUALLANE_APP_VERSION: ${DUALLANE_APP_VERSION:-candidate}
      DUALLANE_GIT_COMMIT: ${DUALLANE_GIT_COMMIT:-working-tree}
      PUBLIC_BASE_URL: http://localhost:${CANDIDATE_WEB_PORT:-8788}
      TRUST_PROXY: "true"
      DUALLANE_P2P_ROOM_TTL_MS: ${CANDIDATE_P2P_ROOM_TTL_MS:-7200000}
      DUALLANE_EMPTY_ROOM_GRACE_MS: ${CANDIDATE_EMPTY_ROOM_GRACE_MS:-10000}
      DUALLANE_P2P_MAX_FRAME_BYTES: ${CANDIDATE_P2P_MAX_FRAME_BYTES:-65536}
      DUALLANE_STUN_URLS: ${CANDIDATE_STUN_URLS:-stun:stun.l.google.com:19302}
      DUALLANE_TURN_URLS: ${CANDIDATE_TURN_URLS:-}
      DUALLANE_TURN_SHARED_SECRET: ${CANDIDATE_TURN_SHARED_SECRET:-}
      DUALLANE_TURN_TTL_SECONDS: ${CANDIDATE_TURN_TTL_SECONDS:-600}
      DUALLANE_TURN_USERNAME: ${CANDIDATE_TURN_USERNAME:-}
      DUALLANE_TURN_CREDENTIAL: ${CANDIDATE_TURN_CREDENTIAL:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/duallane-healthcheck", "http://127.0.0.1:8787/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  workspace:
    image: ${CANDIDATE_WORKSPACE_IMAGE:-duallane-candidate-workspace:local}
    build:
      context: ../..
      dockerfile: Dockerfile.workspace
      args:
        DEBIAN_MIRROR: ${CANDIDATE_DEBIAN_MIRROR:-http://deb.debian.org}
        GO_IMAGE: ${CANDIDATE_GO_IMAGE:-docker.m.daocloud.io/library/golang:1.26-bookworm@sha256:9fdc884aacc3bec89b20ffc69f4bb369c78210e3e4f600387b5128b12c199f81}
        GOPROXY: ${CANDIDATE_GOPROXY:-https://proxy.golang.org,direct}
        RUNTIME_IMAGE: ${CANDIDATE_RUNTIME_IMAGE:-docker.m.daocloud.io/library/debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171}
        DUALLANE_APP_VERSION: ${DUALLANE_APP_VERSION:-candidate}
        DUALLANE_GIT_COMMIT: ${DUALLANE_GIT_COMMIT:-working-tree}
    entrypoint: ["/usr/local/bin/duallane-workspace"]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DUALLANE_APP_VERSION: ${DUALLANE_APP_VERSION:-candidate}
      DUALLANE_GIT_COMMIT: ${DUALLANE_GIT_COMMIT:-working-tree}
      WORKSPACE_ENABLED: ${CANDIDATE_WORKSPACE_ENABLED:-true}
      PUBLIC_BASE_URL: http://localhost:${CANDIDATE_WEB_PORT:-8788}
      WORKSPACE_FRONTEND_URL: http://localhost:${CANDIDATE_WEB_PORT:-8788}
      TRUST_PROXY: "true"
      DUALLANE_DATA_DIR: /app/data
      DUALLANE_MIGRATIONS_DIR: /app/migrations
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${CANDIDATE_POSTGRES_DB:-duallane_candidate}
      PGUSER: ${CANDIDATE_POSTGRES_USER:-duallane_candidate}
      PGPASSWORD: ${CANDIDATE_POSTGRES_PASSWORD:?CANDIDATE_POSTGRES_PASSWORD must be set}
      DATABASE_POOL_MAX: ${CANDIDATE_DATABASE_POOL_MAX:-8}
      DATABASE_SSL: "false"
      GITHUB_CLIENT_ID: ${CANDIDATE_GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${CANDIDATE_GITHUB_CLIENT_SECRET:-}
      GITHUB_PROXY_URL: ${CANDIDATE_GITHUB_PROXY_URL:-}
      GITHUB_OAUTH_TIMEOUT_MS: "8000"
      WORKSPACE_SMTP_ENCRYPTION_KEY: ${CANDIDATE_SMTP_ENCRYPTION_KEY:-}
      WORKSPACE_NTFY_BASE_URL: https://candidate.invalid
      WORKSPACE_NTFY_WORKER_ENABLED: "false"
      WORKSPACE_EMAIL_WORKER_ENABLED: "false"
      WORKSPACE_MAINTENANCE_WORKER_ENABLED: "false"
      WORKSPACE_ECHO_WORKER_ENABLED: "false"
      WORKSPACE_STORAGE_DRIVER: local
      WORKSPACE_STORAGE_LOCAL_READ_FALLBACK: "false"
      WORKSPACE_STORAGE_LOCAL_MIRROR_WRITE: "false"
    volumes:
      - type: volume
        source: candidate-workspace-data
        target: /app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/duallane-healthcheck", "http://127.0.0.1:8787/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    image: ${CANDIDATE_WORKSPACE_IMAGE:-duallane-candidate-workspace:local}
    entrypoint: ["/usr/local/bin/duallane-worker"]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      DUALLANE_APP_VERSION: ${DUALLANE_APP_VERSION:-candidate}
      DUALLANE_GIT_COMMIT: ${DUALLANE_GIT_COMMIT:-working-tree}
      WORKSPACE_ENABLED: ${CANDIDATE_WORKSPACE_ENABLED:-true}
      PUBLIC_BASE_URL: http://localhost:${CANDIDATE_WEB_PORT:-8788}
      WORKSPACE_FRONTEND_URL: http://localhost:${CANDIDATE_WEB_PORT:-8788}
      DUALLANE_DATA_DIR: /app/data
      DUALLANE_MIGRATIONS_DIR: /app/migrations
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${CANDIDATE_POSTGRES_DB:-duallane_candidate}
      PGUSER: ${CANDIDATE_POSTGRES_USER:-duallane_candidate}
      PGPASSWORD: ${CANDIDATE_POSTGRES_PASSWORD:?CANDIDATE_POSTGRES_PASSWORD must be set}
      DATABASE_POOL_MAX: ${CANDIDATE_WORKER_DATABASE_POOL_MAX:-4}
      DATABASE_SSL: "false"
      WORKSPACE_SMTP_ENCRYPTION_KEY: ${CANDIDATE_SMTP_ENCRYPTION_KEY:-}
      WORKSPACE_NTFY_BASE_URL: https://candidate.invalid
      WORKSPACE_NTFY_WORKER_ENABLED: "false"
      WORKSPACE_EMAIL_WORKER_ENABLED: "false"
      WORKSPACE_MAINTENANCE_WORKER_ENABLED: ${CANDIDATE_MAINTENANCE_WORKER_ENABLED:-false}
      WORKSPACE_ECHO_WORKER_ENABLED: ${CANDIDATE_ECHO_WORKER_ENABLED:-false}
      WORKSPACE_STORAGE_DRIVER: local
      WORKSPACE_STORAGE_LOCAL_READ_FALLBACK: "false"
      WORKSPACE_STORAGE_LOCAL_MIRROR_WRITE: "false"
    volumes:
      - type: volume
        source: candidate-workspace-data
        target: /app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/duallane-healthcheck", "http://127.0.0.1:8788/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ${CANDIDATE_WORKSPACE_IMAGE:-duallane-candidate-workspace:local}
    entrypoint: ["/usr/local/bin/duallane-migrate"]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DUALLANE_MIGRATIONS_DIR: /app/migrations
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${CANDIDATE_POSTGRES_DB:-duallane_candidate}
      PGUSER: ${CANDIDATE_POSTGRES_USER:-duallane_candidate}
      PGPASSWORD: ${CANDIDATE_POSTGRES_PASSWORD:?CANDIDATE_POSTGRES_PASSWORD must be set}
    restart: "no"

  postgres:
    image: ${CANDIDATE_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${CANDIDATE_POSTGRES_DB:-duallane_candidate}
      POSTGRES_USER: ${CANDIDATE_POSTGRES_USER:-duallane_candidate}
      POSTGRES_PASSWORD: ${CANDIDATE_POSTGRES_PASSWORD:?CANDIDATE_POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - type: volume
        source: candidate-postgres-data
        target: /var/lib/postgresql/data
    restart: unless-stopped

volumes:
  candidate-postgres-data: {}
  candidate-workspace-data: {}
