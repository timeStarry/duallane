worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  map $http_x_forwarded_proto $duallane_forwarded_proto {
    default $scheme;
    https https;
  }

  log_format duallane_safe '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_user_agent"';
  access_log /dev/stdout duallane_safe;
  error_log /dev/stderr warn;

  server {
    listen 8080;
    server_name _;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://avatars.githubusercontent.com https://fs.tsio.top; connect-src 'self' ws: wss: https://fs.tsio.top; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /metrics { return 404; }
    location = /readyz { return 404; }
    location = /healthz { return 404; }

    # OAuth callback query values remain out of the gateway error log.
    location = /api/auth/github/callback {
      error_log /dev/null crit;
      proxy_pass http://workspace:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
    }

    location = /api/health {
      proxy_pass http://workspace:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
    }

    location ^~ /api/p2p/ {
      # The gateway keeps the existing 11 MiB transport cap. The P2P
      # application still enforces its own 1 MiB JSON parser bound so an
      # application-level 413 remains a JSON response rather than Nginx HTML.
      client_max_body_size 11m;
      proxy_pass http://p2p:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
    }

    location ^~ /api/auth/ {
      client_max_body_size 11m;
      proxy_pass http://workspace:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
    }

    location ^~ /api/workspace/ {
      client_max_body_size 11m;
      proxy_pass http://workspace:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
    }

    location ^~ /api/bot-gateway/ {
      client_max_body_size 11m;
      proxy_pass http://workspace:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
    }

    location ^~ /ws/p2p/ {
      proxy_pass http://p2p:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /ws/workspace {
      proxy_pass http://workspace:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /ws/bot-gateway {
      proxy_pass http://workspace:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/ {
      return 404;
    }

    location /ws/ {
      return 404;
    }

    location /emotes/ {
      expires 7d;
      try_files $uri =404;
    }

    location ~ ^/integrations/v[0-9]+/ {
      etag on;
      if_modified_since exact;
      expires 1y;
      try_files $uri =404;
    }

    location /integrations/ {
      etag on;
      if_modified_since exact;
      expires 5m;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
