map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

map $http_x_forwarded_proto $duallane_forwarded_proto {
  default $scheme;
  https https;
}

log_format duallane_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_user_agent"';

server {
  listen 8080;
  server_name _;

  access_log /var/log/nginx/access.log duallane_safe;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://avatars.githubusercontent.com https://fs.tsio.top; connect-src 'self' ws: wss: https://fs.tsio.top; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  root /usr/share/nginx/html;
  index index.html;

  # Nginx upstream errors include the raw request line. Suppress them only for
  # the OAuth callback so codes and state stay out of this gateway's error log.
  location = /api/auth/github/callback {
    error_log /dev/null crit;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
  }

  location /api/ {
    # Attachment uploads use 4 MiB application chunks. The slightly larger
    # gateway cap also permits bounded avatar and custom-emote source uploads.
    client_max_body_size 11m;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
  }

  location /ws/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $duallane_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /emotes/ {
    expires 7d;
    try_files $uri =404;
  }

  location ~ ^/integrations/v[0-9]+/ {
    etag on;
    if_modified_since exact;
    expires 1y;
    try_files $uri =404;
  }

  location /integrations/ {
    etag on;
    if_modified_since exact;
    expires 5m;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
