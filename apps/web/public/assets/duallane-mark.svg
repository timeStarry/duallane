<svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dl-master-tile" cx="22%" cy="15%" r="115%">
      <stop offset="0%" stop-color="#1E2D45" />
      <stop offset="62%" stop-color="#0B111B" />
      <stop offset="100%" stop-color="#060A11" />
    </radialGradient>
    <linearGradient id="dl-master-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26" />
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="dl-master-blue" x1="0%" y1="12%" x2="95%" y2="88%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="dl-master-amber" x1="0%" y1="12%" x2="95%" y2="88%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="dl-master-lens" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.76" />
    </linearGradient>
    <linearGradient id="dl-master-spec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="dl-master-clip-blue">
      <rect x="44" y="64" width="114" height="140" rx="34" transform="rotate(-12 101 134)" />
    </clipPath>
    <filter id="dl-master-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.38" />
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#dl-master-tile)" />
  <rect x="9" y="9" width="238" height="238" rx="55" stroke="url(#dl-master-border)" stroke-width="2" />

  <g filter="url(#dl-master-shadow)" transform="translate(128 128) scale(0.9) translate(-128 -128)">
    <rect
      x="44"
      y="64"
      width="114"
      height="140"
      rx="34"
      transform="rotate(-12 101 134)"
      fill="url(#dl-master-blue)"
      stroke="url(#dl-master-spec)"
      stroke-width="2"
    />
    <rect
      x="98"
      y="52"
      width="114"
      height="140"
      rx="34"
      transform="rotate(12 155 122)"
      fill="url(#dl-master-amber)"
      fill-opacity="0.9"
      stroke="url(#dl-master-spec)"
      stroke-width="2"
    />
    <g clip-path="url(#dl-master-clip-blue)">
      <rect
        x="98"
        y="52"
        width="114"
        height="140"
        rx="34"
        transform="rotate(12 155 122)"
        fill="url(#dl-master-lens)"
        stroke="#FFFFFF"
        stroke-opacity="0.7"
        stroke-width="1.5"
      />
