name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Test, lint, build, and Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TEST_DATABASE_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type and lint checks
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate production deployment config
        env:
          POSTGRES_VOLUME_NAME: duallane-ci-postgres
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --format json |
            node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8')); const v=c.services.postgres.volumes.find((item) => item.target === '/var/lib/postgresql/data'); if (c.volumes?.[v?.source]?.name !== 'duallane-ci-postgres') throw new Error('production PostgreSQL volume override is ineffective')"
          bash -n deploy/production/deploy.sh

      - name: Build Docker images
        run: docker compose build web api migrate

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
